<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chow Down Order Status - v4.0.0-alpha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: #ff9800;
            text-transform: uppercase;
        }
        .version {
            text-align: center;
            font-size: 1rem;
            color: #888;
            margin-bottom: 25px;
        }
        .board {
            display: flex;
            gap: 20px;
            height: calc(100vh - 120px);
        }
        .column {
            flex: 1;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .col-title {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid rgba(0,0,0,0.2);
            text-transform: uppercase;
        }
        .number-list {
            flex-grow: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Up to 4 per line */
            gap: 10px;
            align-content: start;
            padding: 5px;
        }
        @media(max-width: 1200px) {
            .number-list {
                grid-template-columns: repeat(3, 1fr); /* Fallback to 3 per line on smaller screens */
            }
        }
        .order-badge {
            font-size: 1.4rem; /* Scales dynamically based on volume */
            font-weight: bold;
            padding: 8px 5px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Column 1: White (Received) */
        .col-white { background-color: #f5f5f5; color: #111; }
        .col-white .col-title { color: #333; border-color: #ccc; }
        .col-white .order-badge { background-color: #fff; color: #111; border: 2px solid #ccc; }

        /* Column 2: Yellow (Preparing) */
        .col-yellow { background-color: #ffeb3b; color: #111; }
        .col-yellow .col-title { color: #f57f17; border-color: #fbc02d; }
        .col-yellow .order-badge { background-color: #fffde7; color: #f57f17; border: 2px solid #fbc02d; }

        /* Column 3: Green (Ready) */
        .col-green { background-color: #4caf50; color: #fff; }
        .col-green .col-title { color: #e8f5e9; border-color: #388e3c; }
        .col-green .order-badge { background-color: #e8f5e9; color: #2e7d32; border: 2px solid #388e3c; }
    </style>
</head>
<body>

    <h1>Chow Down Order Status</h1>
    <div class="version">Chow Down v4.0.0-alpha (Customer Board)</div>

    <div class="board">
        <!-- Column 1: Received -->
        <div class="column col-white">
            <div class="col-title">Received</div>
            <div id="list-new" class="number-list"></div>
        </div>
        <!-- Column 2: Preparing -->
        <div class="column col-yellow">
            <div class="col-title">Preparing</div>
            <div id="list-preparing" class="number-list"></div>
        </div>
        <!-- Column 3: Ready -->
        <div class="column col-green">
            <div class="col-title">Ready</div>
            <div id="list-ready" class="number-list"></div>
        </div>
    </div>

    <script>
        async function fetchOrders() {
            try {
                let res = await fetch('/api/orders');
                let orders = await res.json();
                
                let newHtml = '';
                let prepHtml = '';
                let readyHtml = '';

                let activeOrders = orders.filter(o => o.status !== 'collected');

                activeOrders.forEach(o => {
                    let badge = `<div class="order-badge">#${o.num}</div>`;
                    let status = (o.status || 'new').toLowerCase();
                    let items = o.items || [];
                    let hasTickedItems = items.some(it => it.ticked === true);

                    if (status === 'complete' || status === 'done') {
                        readyHtml += badge;
                    } else if (hasTickedItems) {
                        prepHtml += badge;
                    } else {
                        newHtml += badge;
                    }
                });

                document.getElementById('list-new').innerHTML = newHtml || '<p style="color:#666; font-size:1.2rem; grid-column: span 4; text-align:center;">No orders</p>';
                document.getElementById('list-preparing').innerHTML = prepHtml || '<p style="color:#795548; font-size:1.2rem; grid-column: span 4; text-align:center;">No orders</p>';
                document.getElementById('list-ready').innerHTML = readyHtml || '<p style="color:#1b5e20; font-size:1.2rem; grid-column: span 4; text-align:center;">No orders</p>';
            } catch (e) {
                console.error("Error fetching orders:", e);
            }
        }

        setInterval(fetchOrders, 2000);
        fetchOrders();
    </script>
</body>
</html>
