def detect_local_ip():
    ip = "192.168.8.199"
    try:
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.settimeout(2)
        s.connect(("8.8.8.8", 80))
        candidate = s.getsockname()[0]
        s.close()
        if candidate and not candidate.startswith("127."):
            ip = candidate
    except Exception:
        pass
    try:
        hostname_ip = socket.gethostbyname(socket.gethostname())
        if ip == "192.168.8.199" and hostname_ip and not hostname_ip.startswith("127."):
            ip = hostname_ip
    except Exception:
        pass
    return ip

def archive_daily_sales():
    try:
        if not orders:
            return
        total_rand = 0
        item_counts = {}
        for o in orders:
            total_rand += o.get("total", 0)
            for it in o.get("items", []):
                name = it.get("name", it.get("id", "Unknown"))
                qty = it.get("qty", 0)
                item_counts[name] = item_counts.get(name, 0) + qty

        best_item = "None"
        least_item = "None"
        if item_counts:
            sorted_items = sorted(item_counts.items(), key=lambda x: x[1], reverse=True)
            best_item = f"{sorted_items[0][0]} ({sorted_items[0][1]} sold)"
            least_item = f"{sorted_items[-1][0]} ({sorted_items[-1][1]} sold)"

        report = {
            "date": datetime.datetime.now().strftime("%Y-%m-%d %H:%M"),
            "total_rand": total_rand,
            "total_orders_count": len(orders),
            "item_breakdown": item_counts,
            "best_seller": best_item,
            "least_seller": least_item
        }
        history = load_json_safe(F_SALES, [])
        if not isinstance(history, list):
            history = [history]
        history.append(report)
        save(F_SALES, history)
    except Exception:
        pass

def clean_phone_number(phone_str):
    if not phone_str:
        return ""
    p = "".join(filter(str.isdigit, str(phone_str)))
    if p.startswith("27") and len(p) == 11:
        p = "0" + p[2:]
    return p

def get_cleaned_phones():
    if not os.path.exists(F_PHN):
        return []
    with open(F_PHN, "r", encoding="utf-8") as f:
        lines = f.readlines()
    cleaned_list = []
    for line in lines:
        cleaned = clean_phone_number(line.strip())
        if cleaned:
            cleaned_list.append(cleaned)
    return sorted(list(set(cleaned_list)))

def delete_phone_number(target_phone):
    cleaned_target = clean_phone_number(target_phone)
    if not cleaned_target:
        return get_cleaned_phones()
    remaining = [p for p in get_cleaned_phones() if p != cleaned_target]
    with open(F_PHN, "w", encoding="utf-8") as out:
        for p in remaining:
            out.write(p + "\n")
    return remaining

def send_sms(phone, msg):
    if not phone:
        return {"ok": False, "reason": "no_phone"}
    sms_cfg = load_sms_config()
    if not sms_cfg.get("sms_enabled") or not sms_cfg.get("winsms_key"):
        return {"ok": False, "reason": "sms_disabled"}

    p = "".join(filter(str.isdigit, str(phone)))
    if p.startswith("0") and len(p) == 10:
        p = "27" + p[1:]
    api_key = sms_cfg["winsms_key"]

    def go():
        try:
            req = urllib.request.Request(
                "https://api.winsms.co.za/api/rest/v1/sms/outgoing/send",
                data=json.dumps({"message": str(msg), "recipients": [{"mobileNumber": p}]}).encode(),
                method="POST"
            )
            req.add_header("AUTHORIZATION", api_key)
            req.add_header("Content-Type", "application/json")
            req.add_header("Accept", "application/json")
            urllib.request.urlopen(req, timeout=10).read().decode()
        except Exception:
            pass

    threading.Thread(target=go, daemon=True).start()
    return {"ok": True}

