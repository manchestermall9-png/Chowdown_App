name: Native Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Generate Project Structure & Copy v8.7 Files
      run: |
        mkdir -p app/src/main/java/org/chowdown/pos
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        cp -f *.html app/src/main/assets/ 2>/dev/null || true
        cp -f *.json app/src/main/assets/ 2>/dev/null || true
        cp -f *.txt app/src/main/assets/ 2>/dev/null || true

        cat << 'EOF' > settings.gradle
        rootProject.name = "ChowDownPOS"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'org.chowdown.pos'
            compileSdk 34

            defaultConfig {
                applicationId "org.chowdown.pos"
                minSdk 21
                targetSdk 34
                versionCode 870
                versionName "8.7"
            }
            buildTypes {
                debug {
                    minifyEnabled false
                }
                release {
                    minifyEnabled false
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:label="Chow Down POS v8.7"
                android:usesCleartextTraffic="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/org/chowdown/pos/MainActivity.java
        package org.chowdown.pos;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                setContentView(webView);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webView.setWebViewClient(new WebViewClient());
                
                // Connects to your Blackview Tab 8 server running on port 8080
                webView.loadUrl("http://192.168.1.119:8080");
            }
        }
        EOF

    - name: Build Installable v8.7 APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChowDown_v8.7_APK
        path: app/build/outputs/apk/debug/*.apk
