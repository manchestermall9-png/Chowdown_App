class Handler(BaseHTTPRequestHandler):
    def do_GET(self):
        path = urlparse(self.path).path
        if path == '/display':
            self.send_response(200)
            self.send_header('Content-Type', 'text/html; charset=utf-8')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            self.wfile.write(DISPLAY_HTML.encode('utf-8'))
            return

        if path in ['/', '/app', '/order', '/kitchen', '/stock', '/setup', '/app.html']:
            self.send_response(200)
            self.send_header('Content-Type', 'text/html; charset=utf-8')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            self.wfile.write(HTML_CONTENT.encode('utf-8'))
            return

        if path == '/api/version':
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            self.wfile.write(json.dumps({"version": APP_VERSION}).encode())
            return

        if path == '/api/server_info':
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            current_ip = _server_ip or detect_local_ip()
            self.wfile.write(json.dumps({"ip": current_ip, "port": PORT, "url": f"http://{current_ip}:{PORT}"}).encode())
            return

        if path == '/api/store_config':
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            with lock:
                self.wfile.write(json.dumps(load_store_config()).encode())
            return

        if path == '/api/sms_config':
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            with lock:
                self.wfile.write(json.dumps(load_sms_config()).encode())
            return

        if path == '/api/phones':
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            with lock:
                unique_phones = get_cleaned_phones()
            self.wfile.write(json.dumps(unique_phones).encode())
            return

        if path == '/api/daily_sales':
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            history = load_json_safe(F_SALES, [])
            if not isinstance(history, list):
                history = [history]
            self.wfile.write(json.dumps(history).encode())
            return

        api = {
            '/api/orders': orders,
            '/api/stock': stock,
            '/api/menu': menu,
            '/api/categories': categories,
            '/api/counter': {"counter": counter}
        }
        if path in api:
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            with lock:
                self.wfile.write(json.dumps(api[path]).encode())
            return

        self.send_response(404)
        self.end_headers()

    def do_POST(self):
        global orders, counter, stock, menu, categories
        p = urlparse(self.path).path
        cl = int(self.headers.get('Content-Length', 0))
        try:
            data = json.loads(self.rfile.read(cl).decode()) if cl > 0 else {}
            with lock:
                if p == '/api/phones/delete':
                    updated_phones = delete_phone_number(data.get('phone', ''))
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.send_header('Access-Control-Allow-Origin', '*')
                    self.end_headers()
                    self.wfile.write(json.dumps({"ok": True, "phones": updated_phones}).encode())
                    return

                if p == '/api/store_config':
                    saved = save_store_config(data.get('store_name', ''))
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.send_header('Access-Control-Allow-Origin', '*')
                    self.end_headers()
                    self.wfile.write(json.dumps({"ok": True, **saved}).encode())
                    return

                if p == '/api/sms_config':
                    saved = save_sms_config(data.get('sms_enabled', False), data.get('winsms_key', ''))
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.send_header('Access-Control-Allow-Origin', '*')
                    self.end_headers()
                    self.wfile.write(json.dumps({"ok": True, **saved}).encode())
                    return

                if p == '/api/counter':
                    if data.get('reset_day'):
                        archive_daily_sales()
                        orders = []
                        save(F_ORD, orders)

                    counter = int(data.get('counter', counter))
                    save(F_CNT, {"counter": counter})
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.send_header('Access-Control-Allow-Origin', '*')
                    self.end_headers()
                    self.wfile.write(json.dumps({"ok": True, "counter": counter}).encode())
                    return

                if p == '/api/orders':
                    if not data.get('num'):
                        data['num'] = counter
                        counter += 1
                        save(F_CNT, {"counter": counter})
                        data['status'] = 'new'

                        items = data.get('items', [])
                        for item in items:
                            item_id = item.get('id')
                            qty = item.get('qty', 0)
                            if item_id in stock:
                                stock[item_id] = max(0, stock[item_id] - qty)
                        save(F_STK, stock)

                    phone_number = clean_phone_number(data.get('phone', ''))
                    if phone_number:
                        try:
                            existing = get_cleaned_phones()
                            if phone_number not in existing:
                                with open(F_PHN, "a", encoding='utf-8') as ph_file:
                                    ph_file.write(phone_number + "\n")
                        except Exception:
                            pass

                    sms_sent = False
                    if data.get('trigger_sms'):
                        order_num = data.get('num')
                        st_name = load_store_config().get("store_name", "MY STORE")
                        sms_msg = f"Hi! Your {st_name} order #{order_num} is READY for collection. Please pick it up at {st_name}. Thank you!"
                        res_sms = send_sms(data.get('phone', ''), sms_msg)
                        sms_sent = bool(res_sms and res_sms.get("ok"))
                        data.pop('trigger_sms', None)

                    target_num = data.get('num')
                    new_orders = [o for o in orders if o.get('num') != target_num]
                    orders = new_orders

                    orders.append(data)
                    save(F_ORD, orders)

                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.send_header('Access-Control-Allow-Origin', '*')
                    self.end_headers()
                    self.wfile.write(json.dumps({"ok": True, "num": data['num'], "sms_sent": sms_sent}).encode())
                    return
                elif p == '/api/stock':
                    stock = data
                    save(F_STK, stock)
                elif p == '/api/menu':
                    menu = data
                    save(F_MEN, menu)
                elif p == '/api/categories':
                    categories = data
                    save(F_CAT, categories)
                elif p == '/api/bulk-sms':
                    numbers = data.get('numbers', [])
                    msg = data.get('message', '')
                    sent_count = 0
                    for num in numbers:
                        r = send_sms(num, msg)
                        if r and r.get("ok"):
                            sent_count += 1

                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.send_header('Access-Control-Allow-Origin', '*')
                    self.end_headers()
                    self.wfile.write(json.dumps({"ok": True, "sent_count": sent_count}).encode())
                    return

            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.end_headers()
            self.wfile.write(json.dumps({"ok": True}).encode())
        except Exception as e:
            self.send_response(400)
            self.end_headers()
            self.wfile.write(str(e).encode())

    def do_OPTIONS(self):
        self.send_response(200)
        self.send_header('Access-Control-Allow-Origin', '*')
        self.send_header('Access-Control-Allow-Methods', 'GET, POST, OPTIONS')
        self.send_header('Access-Control-Allow-Headers', 'Content-Type')
        self.end_headers()

    def log_message(self, *a): pass

def start_server():
    global _server_started, _server_ip
    with _server_guard_lock:
        if _server_started:
            return
        _server_started = True
        _server_ip = detect_local_ip()

    def _run():
        try:
            server = ThreadingHTTPServer(('0.0.0.0', PORT), Handler)
            server.serve_forever()
        except Exception:
            pass

    t = threading.Thread(target=_run, daemon=True)
    t.start()

if __name__ == "__main__":
    start_server()
    try:
        import time
        while True:
            time.sleep(3600)
    except KeyboardInterrupt:
        pass
