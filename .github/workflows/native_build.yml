        cfg["sms_enabled"] = bool(loaded.get("sms_enabled", False))
        cfg["winsms_key"] = str(loaded.get("winsms_key", "") or "").strip()
    return cfg

def save_sms_config(sms_enabled, winsms_key):
    clean_key = str(winsms_key or "").strip()
