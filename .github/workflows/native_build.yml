          const target = orders.find(o => o.num === orderNum);
          if (!target) return;
          if (newStatus === 'collected') {
            if (!window.confirm("Are you sure?")) return;
          }

          const isMarkingDone = (newStatus === 'done' && target.status !== 'done' && target.status !== 'complete');
          const updated = { ...target, status: newStatus };
          if (updatedItems) updated.items = updatedItems;

          const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...updated, trigger_sms: isMarkingDone })
          });

          if (res.ok) {
            setIsOnline(true);
            const out = await res.json();
            if (isMarkingDone && target.phone && target.phone.trim() !== '') {
              if (out.sms_sent) {
                alert(`[SMS SENT] Order #${orderNum} notification sent to ${target.phone}`);
              } else {
                alert(`Order #${orderNum} marked DONE. (Custom SMS is off or no WinSMS API key is saved.)`);
              }
            }
          }

          const fetchRes = await fetch('/api/orders');
          if (fetchRes.ok) setOrders(await fetchRes.json());
        } catch(err) {
          setIsOnline(false);
        }
      };

      const toggleItemTick = (orderNum, itemIdx) => {
