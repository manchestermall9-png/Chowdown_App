name: Native Android Build

on:
  push:
    branches: [ Commercial ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Generate Project Structure & Copy Server Files
      run: |
        mkdir -p app/src/main/java/org/chowdown/pos
        mkdir -p app/src/main/python
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        if [ ! -f "app/src/main/java/org/chowdown/pos/MainActivity.java" ]; then
          echo "ERROR: Missing app/src/main/java/org/chowdown/pos/MainActivity.java"
          exit 1
        fi

        cp -f *.html app/src/main/assets/ 2>/dev/null || true
        cp -f *.json app/src/main/assets/ 2>/dev/null || true
        cp -f *.txt app/src/main/assets/ 2>/dev/null || true
        cp -f *.py app/src/main/python/ 2>/dev/null || true
        if [ -f "v9.10.py" ]; then
          cp -f "v9.10.py" app/src/main/python/pos_server.py
        fi

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                gradlePluginPortal()
                google()
                mavenCentral()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FoodOrderApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'com.chaquo.python:gradle:17.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'com.chaquo.python'

        android {
            namespace 'org.chowdown.pos'
            compileSdk 34

            defaultConfig {
                applicationId "org.chowdown.pos"
                minSdk 24
                targetSdk 34
                versionCode 910
                versionName "9.10"

                ndk {
                    abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
                }

                python {
                    version "3.10"
                }
            }
            buildTypes {
                debug {
                    minifyEnabled false
                }
                release {
                    minifyEnabled true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        python3 - << 'PY'
        q = chr(34)
        xml = f"""<?xml version={q}1.0{q} encoding={q}utf-8{q}?>
        <manifest xmlns:android={q}http://schemas.android.com/apk/res/android{q}>
            <uses-permission android:name={q}android.permission.INTERNET{q} />
            <uses-permission android:name={q}android.permission.ACCESS_NETWORK_STATE{q} />
            <application
                android:label={q}Food Order App{q}
                android:usesCleartextTraffic={q}true{q}
                android:theme={q}@style/Theme.AppCompat.NoActionBar{q}>
                <activity
                    android:name={q}.MainActivity{q}
                    android:exported={q}true{q}>
                    <intent-filter>
                        <action android:name={q}android.intent.action.MAIN{q} />
                        <category android:name={q}android.intent.category.LAUNCHER{q} />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        """
        with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
            f.write(xml)
        PY

        cat << 'EOF' > app/src/main/python/server_app.py
        import importlib
        import os
        import socket
        import tempfile
        import threading

        _server_started = False
        _server_lock = threading.Lock()
        _last_status = "Starting..."


        def get_status():
            return _last_status


        def is_port_open(host="127.0.0.1", port=8080, timeout=0.3):
            try:
                with socket.create_connection((host, port), timeout=timeout):
                    return True
            except OSError:
                return False


        def _pick_writable_dir():
            candidates = [
                os.environ.get("HOME"),
                tempfile.gettempdir(),
                os.path.dirname(os.path.abspath(__file__)),
            ]
            for path in candidates:
                if not path:
                    continue
                try:
                    data_dir = os.path.join(path, "chowdown_pos_data")
                    os.makedirs(data_dir, exist_ok=True)
                    probe = os.path.join(data_dir, ".write_test")
                    with open(probe, "w", encoding="utf-8") as f:
                        f.write("ok")
                    os.remove(probe)
                    os.chdir(data_dir)
                    return data_dir
                except OSError:
                    continue
            return os.path.dirname(os.path.abspath(__file__))


        def _apply_writable_dir(mod, data_dir):
            if hasattr(mod, "DIR"):
                mod.DIR = data_dir
                for attr, fname in (
                    ("F_ORD", "orders.json"),
                    ("F_STK", "stock.json"),
                    ("F_MEN", "menu.json"),
                    ("F_CAT", "categories.json"),
                    ("F_CNT", "counter.json"),
                    ("F_PHN", "phone_numbers.txt"),
                    ("F_SALES", "daily_sales.json"),
                ):
                    if hasattr(mod, attr):
                        setattr(mod, attr, os.path.join(data_dir, fname))


        def _load_server_module():
            for mod_name in ("pos_server", "main", "server"):
                try:
                    mod = importlib.import_module(mod_name)
                    if hasattr(mod, "Handler") and hasattr(mod, "ThreadingHTTPServer"):
                        return mod, f"{mod_name}.py"
                except Exception:
                    continue
            raise FileNotFoundError("Could not import pos_server module")


        def _run_server():
            global _last_status
            try:
                data_dir = _pick_writable_dir()
                mod, script_name = _load_server_module()
                _apply_writable_dir(mod, data_dir)
                port = int(getattr(mod, "PORT", 8080))
                handler = getattr(mod, "Handler", None)
                server_cls = getattr(mod, "ThreadingHTTPServer", None)

                if handler is None or server_cls is None:
                    _last_status = f"Missing Handler or ThreadingHTTPServer in {script_name}"
                    return

                if is_port_open("127.0.0.1", port):
                    _last_status = f"Port {port} already listening ({script_name})"
                    return

                _last_status = f"Listening on 0.0.0.0:{port} ({script_name})"
                server_cls(("0.0.0.0", port), handler).serve_forever()
            except Exception as exc:
                _last_status = f"Server error: {exc}"


        def start_server():
            global _server_started, _last_status
            with _server_lock:
                if _server_started:
                    return _last_status
                _server_started = True
                _last_status = "Launching server thread..."
                thread = threading.Thread(target=_run_server, daemon=True)
                thread.start()
            return _last_status
        EOF

        ls -la app/src/main/python

    - name: Build Installable APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoodOrderApp_v9.10_APK
        path: app/build/outputs/apk/debug/*.apk
