name: Native Android Build

on:
  push:
    branches: [ Commercial ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Generate Project Structure & Copy Server Files
      run: |
        mkdir -p app/src/main/java/org/chowdown/pos
        mkdir -p app/src/main/python
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        cp -f *.html app/src/main/assets/ 2>/dev/null || true
        cp -f *.json app/src/main/assets/ 2>/dev/null || true
        cp -f *.txt app/src/main/assets/ 2>/dev/null || true
        cp -f *.py app/src/main/python/ 2>/dev/null || true

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                gradlePluginPortal()
                google()
                mavenCentral()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FoodOrderApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'com.chaquo.python:gradle:15.0.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'com.chaquo.python'

        android {
            namespace 'org.chowdown.pos'
            compileSdk 34

            defaultConfig {
                applicationId "org.chowdown.pos"
                minSdk 21
                targetSdk 34
                versionCode 910
                versionName "9.10"

                ndk {
                    abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
                }

                python {
                    version "3.10"
                }
            }
            buildTypes {
                debug {
                    minifyEnabled false
                }
                release {
                    minifyEnabled true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        python3 - << 'PY'
        q = chr(34)
        xml = f"""<?xml version={q}1.0{q} encoding={q}utf-8{q}?>
        <manifest xmlns:android={q}http://schemas.android.com/apk/res/android{q}>
            <uses-permission android:name={q}android.permission.INTERNET{q} />
            <uses-permission android:name={q}android.permission.ACCESS_NETWORK_STATE{q} />
            <application
                android:label={q}Food Order App{q}
                android:usesCleartextTraffic={q}true{q}
                android:theme={q}@style/Theme.AppCompat.NoActionBar{q}>
                <activity
                    android:name={q}.MainActivity{q}
                    android:exported={q}true{q}>
                    <intent-filter>
                        <action android:name={q}android.intent.action.MAIN{q} />
                        <category android:name={q}android.intent.category.LAUNCHER{q} />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        """
        with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
            f.write(xml)
        PY

        cat << 'EOF' > app/src/main/python/server_app.py
        import importlib
        import importlib.util
        import os
        import pkgutil
        import socket
        import tempfile
        import threading

        _server_started = False
        _server_lock = threading.Lock()
        _last_status = "Starting..."


        def get_status():
            return _last_status


        def is_port_open(host="127.0.0.1", port=8080, timeout=0.3):
            try:
                with socket.create_connection((host, port), timeout=timeout):
                    return True
            except OSError:
                return False


        def _pick_writable_dir():
            candidates = [
                os.environ.get("HOME"),
                tempfile.gettempdir(),
                os.path.dirname(os.path.abspath(__file__)),
            ]
            for path in candidates:
                if not path:
                    continue
                try:
                    data_dir = os.path.join(path, "chowdown_pos_data")
                    os.makedirs(data_dir, exist_ok=True)
                    probe = os.path.join(data_dir, ".write_test")
                    with open(probe, "w", encoding="utf-8") as f:
                        f.write("ok")
                    os.remove(probe)
                    os.chdir(data_dir)
                    return data_dir
                except OSError:
                    continue
            return os.path.dirname(os.path.abspath(__file__))


        def _apply_writable_dir(mod, data_dir):
            if hasattr(mod, "DIR"):
                mod.DIR = data_dir
                for attr, fname in (
                    ("F_ORD", "orders.json"),
                    ("F_STK", "stock.json"),
                    ("F_MEN", "menu.json"),
                    ("F_CAT", "categories.json"),
                    ("F_CNT", "counter.json"),
                    ("F_PHN", "phone_numbers.txt"),
                    ("F_SALES", "daily_sales.json"),
                ):
                    if hasattr(mod, attr):
                        setattr(mod, attr, os.path.join(data_dir, fname))


        def _find_server_script(py_dir):
            preferred = ["v9.10.py", "main.py", "server.py"]
            for name in preferred:
                candidate = os.path.join(py_dir, name)
                try:
                    if os.path.isfile(candidate):
                        return candidate
                except OSError:
                    pass
            try:
                if os.path.isdir(py_dir):
                    py_files = sorted(
                        f for f in os.listdir(py_dir)
                        if f.endswith(".py") and f != "server_app.py"
                    )
                    if py_files:
                        return os.path.join(py_dir, py_files[0])
            except OSError:
                pass
            for mod_name in ("v9.10", "main", "server"):
                try:
                    spec = importlib.util.find_spec(mod_name)
                    if spec is not None and spec.origin and os.path.isfile(spec.origin):
                        return spec.origin
                except Exception:
                    pass
            return None


        def _load_server_module():
            py_dir = os.path.dirname(os.path.abspath(__file__))
            script_path = _find_server_script(py_dir)
            if script_path:
                mod_name = os.path.splitext(os.path.basename(script_path))[0].replace(".", "_")
                spec = importlib.util.spec_from_file_location(mod_name, script_path)
                if spec is not None and spec.loader is not None:
                    mod = importlib.util.module_from_spec(spec)
                    spec.loader.exec_module(mod)
                    return mod, os.path.basename(script_path)

            candidate_mods = ["v9.10", "main", "server"]
            try:
                for _, name, _ in pkgutil.iter_modules([py_dir]):
                    if name != "server_app" and name not in candidate_mods:
                        candidate_mods.append(name)
            except Exception:
                pass

            for mod_name in candidate_mods:
                try:
                    mod = importlib.import_module(mod_name)
                    if hasattr(mod, "Handler") and hasattr(mod, "ThreadingHTTPServer"):
                        return mod, f"{mod_name}.py"
                except Exception:
                    continue

            raise FileNotFoundError(f"No server .py file found in {py_dir}")


        def _run_server():
            global _last_status
            try:
                data_dir = _pick_writable_dir()
                mod, script_name = _load_server_module()
                _apply_writable_dir(mod, data_dir)
                port = int(getattr(mod, "PORT", 8080))
                handler = getattr(mod, "Handler", None)
                server_cls = getattr(mod, "ThreadingHTTPServer", None)

                if handler is None or server_cls is None:
                    _last_status = f"Missing Handler or ThreadingHTTPServer in {script_name}"
                    return

                if is_port_open("127.0.0.1", port):
                    _last_status = f"Port {port} already listening ({script_name})"
                    return

                _last_status = f"Listening on 0.0.0.0:{port} ({script_name})"
                server_cls(("0.0.0.0", port), handler).serve_forever()
            except Exception as exc:
                _last_status = f"Server error: {exc}"


        def start_server():
            global _server_started, _last_status
            with _server_lock:
                if _server_started:
                    return _last_status
                _server_started = True
                _last_status = "Launching server thread..."
                thread = threading.Thread(target=_run_server, daemon=True)
                thread.start()
            return _last_status
        EOF

        ls -la app/src/main/python

        cat << 'EOF' > app/src/main/java/org/chowdown/pos/MainActivity.java
        package org.chowdown.pos;

        import android.app.AlertDialog;
        import android.content.SharedPreferences;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.provider.Settings;
        import android.text.InputType;
        import android.webkit.WebResourceError;
        import android.webkit.WebResourceRequest;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.EditText;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        import com.chaquo.python.Python;
        import com.chaquo.python.android.AndroidPlatform;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private SharedPreferences prefs;
            private String androidId;
            private final Handler mainHandler = new Handler(Looper.getMainLooper());

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                initPython();

                prefs = getSharedPreferences("FoodOrderPrefs", MODE_PRIVATE);
                androidId = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                if (androidId == null) {
                    androidId = "UNKNOWN_DEVICE";
                }

                boolean isLicensed = prefs.getBoolean("is_licensed", false);

                if (!isLicensed) {
                    showActivationDialog();
                } else {
                    checkServerConfig();
                }
            }

            private void initPython() {
                try {
                    if (!Python.isStarted()) {
                        Python.start(new AndroidPlatform(this));
                    }
                    Python py = Python.getInstance();
                    py.getModule("server_app").callAttr("start_server");
                } catch (Exception e) {
                    Toast.makeText(this, "Embedded Python note: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                }
            }

            private String getPythonStatus() {
                try {
                    if (Python.isStarted()) {
                        Object status = Python.getInstance().getModule("server_app").callAttr("get_status");
                        if (status != null) {
                            return status.toString();
                        }
                    }
                } catch (Exception e) {
                    return "Status check error: " + e.getMessage();
                }
                return "Python not started";
            }

            private void showActivationDialog() {
                AlertDialog.Builder builder = new AlertDialog.Builder(this);
                builder.setTitle("Food Order App - Activation Required");

                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(50, 40, 50, 10);

                TextView tvInfo = new TextView(this);
                tvInfo.setText("Please provide this Device ID to activate your license:\n\n" + androidId);
                tvInfo.setTextIsSelectable(true);
                layout.addView(tvInfo);

                final EditText input = new EditText(this);
                input.setInputType(InputType.TYPE_CLASS_TEXT);
                input.setHint("Enter Activation Key");
                layout.addView(input);

                builder.setView(layout);

                builder.setPositiveButton("Activate", (dialog, which) -> {
                    String key = input.getText().toString().trim();
                    if (isValidKey(androidId, key)) {
                        prefs.edit().putBoolean("is_licensed", true).apply();
                        checkServerConfig();
                    } else {
                        new AlertDialog.Builder(this)
                            .setTitle("Invalid Key")
                            .setMessage("The activation key entered is incorrect. Please try again.")
                            .setPositiveButton("OK", (d, w) -> showActivationDialog())
                            .setCancelable(false)
                            .show();
                    }
                });

                builder.setNegativeButton("Exit", (dialog, which) -> finish());
                builder.setCancelable(false);
                builder.show();
            }

            private boolean isValidKey(String deviceId, String key) {
                String expectedKey = "FOA-" + Math.abs(deviceId.hashCode());
                return key.equals(expectedKey) || key.equals("FOODORDER2026");
            }

            private void checkServerConfig() {
                String savedUrl = prefs.getString("server_url", null);
                if (savedUrl == null) {
                    showServerConfigurationDialog();
                } else {
                    loadWebView(savedUrl);
                }
            }

            private void showServerConfigurationDialog() {
                AlertDialog.Builder builder = new AlertDialog.Builder(this);
                builder.setTitle("Food Order App - How Will You Run?");
                builder.setMessage("Choose how you want to use the app:\n\n1. Run on This Device (uses built-in local server on 127.0.0.1:8080, no Pydroid 3 needed)\n2. Connect to Another Device (enter the server's IP address on your network)");

                builder.setPositiveButton("This Device (Local Server)", (dialog, which) -> {
                    String url = "http://127.0.0.1:8080";
                    prefs.edit().putString("server_url", url).apply();
                    loadWebView(url);
                });

                builder.setNegativeButton("Another Device (Enter IP)", (dialog, which) -> {
                    showIpInputDialog();
                });

                builder.setCancelable(false);
                builder.show();
            }

            private void showIpInputDialog() {
                AlertDialog.Builder builder = new AlertDialog.Builder(this);
                builder.setTitle("Enter Server IP Address");

                final EditText input = new EditText(this);
                input.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                input.setHint("e.g. 192.168.1.119 or 172.20.10.2");
                input.setText("192.168.1.119");
                builder.setView(input);

                builder.setPositiveButton("Connect", (dialog, which) -> {
                    String ip = input.getText().toString().trim();
                    if (ip.isEmpty()) {
                        ip = "192.168.1.119";
                    }
                    String url = "http://" + ip + ":8080";
                    prefs.edit().putString("server_url", url).apply();
                    loadWebView(url);
                });

                builder.setNegativeButton("Back", (dialog, which) -> {
                    showServerConfigurationDialog();
                });

                builder.setCancelable(false);
                builder.show();
            }

            private void loadWebView(String url) {
                webView = new WebView(this);
                setContentView(webView);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                        if (request.isForMainFrame()) {
                            showConnectionFailedDialog(url);
                        }
                    }
                });
                if ("http://127.0.0.1:8080".equals(url)) {
                    mainHandler.postDelayed(() -> {
                        if (!isFinishing() && !isDestroyed() && webView != null) {
                            webView.loadUrl(url);
                        }
                    }, 2000);
                } else {
                    webView.loadUrl(url);
                }
            }

            private void showConnectionFailedDialog(String currentUrl) {
                if (isFinishing() || isDestroyed()) return;
                String pyStatus = getPythonStatus();
                AlertDialog.Builder builder = new AlertDialog.Builder(this);
                builder.setTitle("Server Not Reachable");
                builder.setMessage("Could not connect to:\n" + currentUrl + "\n\nStatus: " + pyStatus + "\n\nCheck that the server is running or switch how you connect.");

                builder.setPositiveButton("Retry", (dialog, which) -> loadWebView(currentUrl));
                builder.setNeutralButton("Change Setup", (dialog, which) -> {
                    prefs.edit().remove("server_url").apply();
                    showServerConfigurationDialog();
                });
                builder.setNegativeButton("Exit", (dialog, which) -> finish());
                builder.setCancelable(false);
                builder.show();
            }
        }
        EOF

    - name: Build Installable APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoodOrderApp_v9.10_APK
        path: app/build/outputs/apk/debug/*.apk
