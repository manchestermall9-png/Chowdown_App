name: Native Android Build

on:
  push:
    branches: [ main, master, Commercial2 ]
  workflow_dispatch:

env:
  LICENSE_PEPPER: ${{ secrets.LICENSE_PEPPER }}
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  RELEASE_KEYSTORE_PATH: app/release.jks

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Update Whitelisted Device IDs in LicenseManager
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          target = Path("app/src/main/java/org/chowdown/pos/MainActivity.java")
          if target.exists():
              text = target.read_text(encoding="utf-8")
              old_block = '''String[] WHITELISTED_DEVICE_IDS = {'''
              new_block = '''String[] WHITELISTED_DEVICE_IDS = {
                      "e65012f256e4264b",
                      "Bddb4abb6d76b0e8"'''
              if "e65012f256e4264b" not in text and old_block in text:
                  text = text.replace(old_block, new_block, 1)
                  target.write_text(text, encoding="utf-8")
          EOF

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ env.RELEASE_KEYSTORE_PATH }}"

      - name: Build Android APK
        run: |
          chmod +x ./gradlew || true
          if [ -x "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VendorPOS-v9.11.12-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
